<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>귀여운 뽑기판~~~</title>
    <style>
      :root {
        --ink: #332b2f;
        --muted: #766b70;
        --paper: #fffaf3;
        --pink: #ff8fb3;
        --coral: #ffb199;
        --mint: #8ee3c8;
        --sky: #9bd7ff;
        --yellow: #ffe28a;
        --line: rgba(51, 43, 47, 0.14);
        --shadow: 0 18px 45px rgba(117, 68, 86, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        font-family:
          "Pretendard", "Apple SD Gothic Neo", "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(
            circle at 12% 12%,
            rgba(255, 226, 138, 0.55) 0 12%,
            transparent 13%
          ),
          radial-gradient(
            circle at 88% 16%,
            rgba(142, 227, 200, 0.55) 0 10%,
            transparent 11%
          ),
          linear-gradient(135deg, #fff7dc 0%, #ffe5ef 44%, #e4f7ff 100%);
      }

      button,
      input {
        font: inherit;
      }

      .app {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 44px;
      }

      .top {
        display: grid;
        grid-template-columns: 1fr minmax(280px, 380px);
        gap: 20px;
        align-items: stretch;
      }

      .hero,
      .editor,
      .result {
        border: 2px solid rgba(255, 255, 255, 0.78);
        background: rgba(255, 250, 243, 0.82);
        box-shadow: var(--shadow);
        backdrop-filter: blur(14px);
      }

      .hero {
        position: relative;
        overflow: hidden;
        min-height: 230px;
        padding: 30px;
        border-radius: 8px;
      }

      .hero::before,
      .hero::after {
        position: absolute;
        inset: auto;
        width: 140px;
        height: 140px;
        border-radius: 50%;
        content: "";
        opacity: 0.5;
      }

      .hero::before {
        right: -42px;
        top: -46px;
        background: var(--pink);
      }

      .hero::after {
        left: 36%;
        bottom: -86px;
        background: var(--mint);
      }

      h1 {
        position: relative;
        z-index: 1;
        max-width: 620px;
        margin: 0;
        font-size: clamp(2rem, 5vw, 4.5rem);
        line-height: 1.02;
        letter-spacing: 0;
      }

      .subtitle {
        position: relative;
        z-index: 1;
        max-width: 560px;
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 1.04rem;
        line-height: 1.65;
      }

      .toolbar {
        position: relative;
        z-index: 1;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 24px;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 44px;
        padding: 0 16px;
        border: 0;
        border-radius: 8px;
        color: #fff;
        font-weight: 800;
        cursor: pointer;
        background: #33313f;
        box-shadow: 0 8px 0 rgba(51, 49, 63, 0.18);
        transition:
          transform 150ms ease,
          box-shadow 150ms ease;
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 0 rgba(51, 49, 63, 0.15);
      }

      .btn:active {
        transform: translateY(2px);
        box-shadow: 0 4px 0 rgba(51, 49, 63, 0.18);
      }

      .btn.primary {
        background: linear-gradient(135deg, #ff6f9d, #ff9d6e);
      }

      .editor {
        display: flex;
        flex-direction: column;
        min-height: 230px;
        padding: 18px;
        border-radius: 8px;
      }

      .editor h2,
      .result h2 {
        margin: 0 0 12px;
        font-size: 1.05rem;
      }

      .product-list {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 8px;
        max-height: 292px;
        overflow: auto;
        padding-right: 4px;
      }

      .product-input {
        width: 100%;
        min-height: 38px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        color: var(--ink);
        background: rgba(255, 255, 255, 0.82);
        outline: none;
      }

      .product-input:focus {
        border-color: var(--pink);
        box-shadow: 0 0 0 3px rgba(255, 143, 179, 0.2);
      }

      .board-wrap {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 20px;
        align-items: start;
        margin-top: 20px;
      }

      .board {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }

      .card {
        position: relative;
        display: grid;
        place-items: center;
        min-height: 150px;
        border: 0;
        border-radius: 8px;
        color: var(--ink);
        cursor: pointer;
        perspective: 900px;
        background: transparent;
        outline: none;
      }

      .card-shell {
        position: absolute;
        inset: 0;
        border-radius: 8px;
        transform-style: preserve-3d;
        transition: transform 520ms cubic-bezier(0.2, 0.8, 0.25, 1);
      }

      .card.revealed .card-shell {
        transform: rotateY(180deg);
      }

      .card-face {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 14px;
        border: 2px solid rgba(255, 255, 255, 0.78);
        border-radius: 8px;
        backface-visibility: hidden;
        box-shadow: 0 14px 28px rgba(117, 68, 86, 0.16);
      }

      .front {
        overflow: hidden;
        background:
          linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.72),
            rgba(255, 255, 255, 0.28)
          ),
          var(--card-color);
      }

      .front::before {
        position: absolute;
        top: 18px;
        left: 18px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.68);
        content: "";
        box-shadow:
          46px 22px 0 rgba(255, 255, 255, 0.34),
          108px 58px 0 rgba(255, 255, 255, 0.38);
      }

      .front-icon {
        display: grid;
        place-items: center;
        width: 78px;
        height: 78px;
        border-radius: 50%;
        font-size: 2.1rem;
        background: rgba(255, 255, 255, 0.75);
        box-shadow: inset 0 -8px 0 rgba(51, 43, 47, 0.06);
      }

      .front-number {
        position: absolute;
        right: 12px;
        bottom: 10px;
        color: rgba(51, 43, 47, 0.48);
        font-size: 0.9rem;
        font-weight: 900;
      }

      .back {
        transform: rotateY(180deg);
        text-align: center;
        background: var(--paper);
      }

      .prize {
        display: grid;
        gap: 8px;
        justify-items: center;
      }

      .prize-icon {
        font-size: 2rem;
      }

      .prize-name {
        max-width: 100%;
        font-size: clamp(1rem, 2.2vw, 1.28rem);
        font-weight: 900;
        overflow-wrap: anywhere;
      }

      .card:hover .card-shell,
      .card:focus-visible .card-shell {
        filter: brightness(1.04);
      }

      .result {
        position: sticky;
        top: 16px;
        padding: 20px;
        border-radius: 8px;
      }

      .result-box {
        display: grid;
        place-items: center;
        min-height: 170px;
        padding: 18px;
        border: 2px dashed rgba(51, 43, 47, 0.18);
        border-radius: 8px;
        text-align: center;
        background: rgba(255, 255, 255, 0.58);
      }

      .result-emoji {
        font-size: 2.6rem;
        line-height: 1;
      }

      .result-name {
        margin-top: 12px;
        font-size: 1.28rem;
        font-weight: 900;
        overflow-wrap: anywhere;
      }

      .result-note {
        margin-top: 8px;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.45;
      }

      .mini-log {
        display: grid;
        gap: 8px;
        margin-top: 14px;
      }

      .log-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        min-height: 34px;
        padding: 6px 10px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.58);
        color: var(--muted);
        font-size: 0.88rem;
      }

      .confetti {
        position: fixed;
        top: -20px;
        width: 10px;
        height: 16px;
        pointer-events: none;
        animation: fall 900ms ease-in forwards;
        background: var(--piece-color);
        z-index: 10;
      }

      @keyframes fall {
        to {
          transform: translateY(110vh) rotate(540deg);
          opacity: 0;
        }
      }

      @media (max-width: 920px) {
        .top,
        .board-wrap {
          grid-template-columns: 1fr;
        }

        .result {
          position: static;
        }
      }

      @media (max-width: 680px) {
        .app {
          width: min(100% - 20px, 1180px);
          padding-top: 18px;
        }

        .hero {
          padding: 22px;
        }

        .board {
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: 10px;
        }

        .card {
          min-height: 118px;
        }

        .front-icon {
          width: 58px;
          height: 58px;
          font-size: 1.7rem;
        }
      }

      @media (max-width: 430px) {
        .product-list,
        .board {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main class="app">
      <section class="top">
        <div class="hero">
          <h1>오늘의 귀여운 뽑기판</h1>
          <p class="subtitle">
            상품 이름을 바꾸면 카드 뒷면과 결과가 바로 업데이트됩니다. 12장의
            카드를 섞고, 하나씩 눌러서 반짝이는 결과를 확인해보세요.
          </p>
          <div class="toolbar">
            <button class="btn primary" id="shuffleButton" type="button">
              섞기
            </button>
            <button class="btn" id="resetButton" type="button">
              다시 닫기
            </button>
          </div>
        </div>

        <aside class="editor" aria-label="상품 수정">
          <h2>상품 실시간 변경</h2>
          <div class="product-list" id="productList"></div>
        </aside>
      </section>

      <section class="board-wrap">
        <div class="board" id="board" aria-label="뽑기 카드 12장"></div>

        <aside class="result">
          <h2>뽑기 결과</h2>
          <div class="result-box">
            <div>
              <div class="result-emoji" id="resultEmoji">?</div>
              <div class="result-name" id="resultName">카드를 골라주세요</div>
              <div class="result-note" id="resultNote">
                상품명은 오른쪽 입력창에서 바로 바꿀 수 있어요.
              </div>
            </div>
          </div>
          <div class="mini-log" id="log"></div>
        </aside>
      </section>
    </main>

    <script>
      const defaultProducts = [
        "딸기 마카롱",
        "미니 곰돌이 키링",
        "반짝 스티커팩",
        "달콤 초코쿠키",
        "구름 양말",
        "하트 머그컵",
        "복숭아 젤리",
        "행운 포토카드",
        "꽃향기 핸드크림",
        "별빛 노트",
        "토끼 파우치",
        "왕 리본핀",
      ];

      const icons = [
        "★",
        "♥",
        "☘",
        "✿",
        "◆",
        "●",
        "✦",
        "♬",
        "☀",
        "✧",
        "○",
        "◇",
      ];
      const colors = [
        "#ffc2d6",
        "#ffd0a8",
        "#ffe58f",
        "#b7efd7",
        "#aee8ff",
        "#cfc2ff",
      ];
      const board = document.querySelector("#board");
      const productList = document.querySelector("#productList");
      const resultEmoji = document.querySelector("#resultEmoji");
      const resultName = document.querySelector("#resultName");
      const resultNote = document.querySelector("#resultNote");
      const log = document.querySelector("#log");
      const shuffleButton = document.querySelector("#shuffleButton");
      const resetButton = document.querySelector("#resetButton");

      let products = [...defaultProducts];
      let cardOrder = products.map((_, index) => index);
      let revealed = new Set();
      let history = [];

      function renderInputs() {
        productList.innerHTML = "";

        products.forEach((product, index) => {
          const input = document.createElement("input");
          input.className = "product-input";
          input.type = "text";
          input.value = product;
          input.placeholder = `${index + 1}번 상품`;
          input.setAttribute("aria-label", `${index + 1}번 상품명`);
          input.addEventListener("input", (event) => {
            products[index] =
              event.target.value.trim() || `${index + 1}번 빈 상품`;
            renderBoard();
            updateLiveResult(index);
          });
          productList.appendChild(input);
        });
      }

      function renderBoard() {
        board.innerHTML = "";

        cardOrder.forEach((productIndex, boardIndex) => {
          const card = document.createElement("button");
          card.className = "card";
          card.type = "button";
          card.style.setProperty(
            "--card-color",
            colors[boardIndex % colors.length],
          );
          card.setAttribute("aria-label", `${boardIndex + 1}번 카드 열기`);

          if (revealed.has(boardIndex)) {
            card.classList.add("revealed");
          }

          card.innerHTML = `
          <span class="card-shell">
            <span class="card-face front">
              <span class="front-icon">${icons[boardIndex % icons.length]}</span>
              <span class="front-number">${String(boardIndex + 1).padStart(2, "0")}</span>
            </span>
            <span class="card-face back">
              <span class="prize">
                <span class="prize-icon">${icons[productIndex % icons.length]}</span>
                <span class="prize-name">${escapeHtml(products[productIndex])}</span>
              </span>
            </span>
          </span>
        `;

          card.addEventListener("click", () =>
            revealCard(boardIndex, productIndex),
          );
          board.appendChild(card);
        });
      }

      function revealCard(boardIndex, productIndex) {
        revealed.add(boardIndex);
        const prize = products[productIndex];
        resultEmoji.textContent = icons[productIndex % icons.length];
        resultName.textContent = prize;
        resultNote.textContent = `${boardIndex + 1}번 카드에서 나왔어요.`;
        history = [`${boardIndex + 1}번: ${prize}`, ...history].slice(0, 4);
        renderLog();
        renderBoard();
        burstConfetti();
      }

      function updateLiveResult(productIndex) {
        const current = resultName.textContent;
        const oldNames = defaultProducts.concat(
          history.map((item) => item.replace(/^\d+번: /, "")),
        );

        if (oldNames.includes(current) || current === products[productIndex]) {
          resultName.textContent = products[productIndex];
        }

        history = history.map((item) => {
          const prefix = item.match(/^\d+번: /)?.[0] || "";
          const boardIndex = Number(prefix.replace(/\D/g, "")) - 1;
          const mappedProduct = cardOrder[boardIndex];
          return mappedProduct === productIndex
            ? `${boardIndex + 1}번: ${products[productIndex]}`
            : item;
        });
        renderLog();
      }

      function renderLog() {
        log.innerHTML = "";

        if (history.length === 0) {
          return;
        }

        history.forEach((item, index) => {
          const row = document.createElement("div");
          row.className = "log-item";
          row.innerHTML = `<span>${escapeHtml(item)}</span><strong>#${history.length - index}</strong>`;
          log.appendChild(row);
        });
      }

      function shuffleCards() {
        cardOrder = products.map((_, index) => index);

        for (let i = cardOrder.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [cardOrder[i], cardOrder[j]] = [cardOrder[j], cardOrder[i]];
        }

        revealed = new Set();
        history = [];
        resultEmoji.textContent = "!";
        resultName.textContent = "섞기 완료";
        resultNote.textContent = "새로운 마음으로 한 장을 골라보세요.";
        renderLog();
        renderBoard();
      }

      function resetCards() {
        revealed = new Set();
        history = [];
        resultEmoji.textContent = "?";
        resultName.textContent = "카드를 골라주세요";
        resultNote.textContent =
          "상품명은 오른쪽 입력창에서 바로 바꿀 수 있어요.";
        renderLog();
        renderBoard();
      }

      function burstConfetti() {
        const pieces = 22;

        for (let i = 0; i < pieces; i += 1) {
          const piece = document.createElement("span");
          piece.className = "confetti";
          piece.style.left = `${Math.random() * 100}vw`;
          piece.style.animationDelay = `${Math.random() * 180}ms`;
          piece.style.setProperty("--piece-color", colors[i % colors.length]);
          document.body.appendChild(piece);
          setTimeout(() => piece.remove(), 1200);
        }
      }

      function escapeHtml(value) {
        return value
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      shuffleButton.addEventListener("click", shuffleCards);
      resetButton.addEventListener("click", resetCards);

      renderInputs();
      renderBoard();
    </script>
  </body>
</html>
